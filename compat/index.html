<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#080b12" />
<title>Milthm 播放器</title>
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/play-controls.css" />
<link rel="stylesheet" href="css/play-enlarged.css" />
<link rel="stylesheet" href="css/pause-menu.css" />
<link rel="stylesheet" href="css/delay-calibration.css" />
<link rel="stylesheet" href="css/gameplay-touch.css" />
<link rel="stylesheet" href="css/final-fullscreen.css" />
<link rel="stylesheet" href="css/targeted-review.css" />
<link rel="stylesheet" href="css/result-page.css" />
<link rel="stylesheet" href="css/result-in-stage.css" />
<link rel="stylesheet" href="css/video-export.css" />
<link rel="stylesheet" href="css/ios12-fallback.css" />
<link rel="stylesheet" href="css/shell-refresh.css" />
</head>
<body data-mode="play">
<div class="wrap">
<header><h1>Milthm 播放器</h1><div class="badge" id="modeBadge">游玩模式</div></header>
<section class="card"><div class="upload"><label class="drop" id="dropZone" for="fileInput"><div class="dropIcon" aria-hidden="true">↥</div><div><strong>导入谱面与资源</strong><small>点击选择或拖入谱面、音乐和图片，也支持 ZIP / 7z 压缩包</small></div></label><input id="fileInput" type="file" multiple accept="*/*" /></div><div id="status" class="status"></div><textarea id="parseLog" class="parseLog" readonly hidden aria-live="polite"></textarea><div class="packageChartChooser" id="packageChartChooser" hidden><label for="packageChartSelect">游玩谱面</label><select id="packageChartSelect" aria-label="选择游玩的谱面"></select></div></section>
<section class="card playerCard" id="playerCard"><div class="playerTop"><div class="titleBox"><strong id="songTitle">未加载</strong><small id="songSub">-</small></div><div class="stats"><span class="stat" id="statNotes">0 notes</span></div></div><div class="stageWrap" id="stageWrap"><div class="stageInner" id="stageInner"><canvas id="stage" width="1280" height="720"></canvas><div class="fsLeft"><button id="fsBack1Btn" title="回退 1 秒">↶ 1s</button></div><div class="corner"><button id="resetViewBtn" title="重置暂停缩放">1:1</button><button id="fullscreenBtn" title="横屏全屏">⛶</button></div></div></div><div class="controls"><div class="row"><button id="playBtn" class="primary">▶</button><button id="back1Btn" title="回退 1 秒">−1s</button><button id="forward1Btn" title="前进 1 秒">+1s</button><input id="timeSlider" class="grow" type="range" min="0" max="0" step="0.001" value="0" aria-label="播放进度"><input id="timeInput" class="timeInput" type="number" step="0.001" value="0" aria-label="当前时间，秒"><span id="durationLabel" class="hint">/ 0.000s</span></div><div class="row settingsRow"><div class="settingGroup speedGroup"><label for="rateSelect">播放倍速</label><div class="settingPair"><select id="rateSelect" aria-label="常用倍速"><option value="0.25">0.25x</option><option value="0.5">0.5x</option><option value="0.75">0.75x</option><option value="1" selected>1x</option><option value="1.25">1.25x</option><option value="1.5">1.5x</option><option value="2">2x</option><option value="4">4x</option></select><input id="rateInput" class="rateInput" type="number" min="0.05" max="8" step="0.05" value="1" aria-label="自定义倍速"></div></div><label class="settingGroup volumeGroup" for="audioVolumeInput"><span>音量</span><input id="audioVolumeInput" class="volumeInput" type="range" min="0" max="1" step="0.01" value="1"></label><span id="mediaName" class="mediaName">无音乐</span></div><div class="row settingsRow secondarySettings"><label class="settingGroup brightnessGroup" for="bgBrightnessInput"><span>背景亮度</span><input id="bgBrightnessInput" class="volumeInput" type="range" min="0.05" max="1" step="0.01" value="0.6"></label><div class="settingGroup ratioGroup"><span>画面比例 <small>留空为 16:9</small></span><div class="settingPair"><input id="ratioLengthInput" class="ratioInput" type="number" min="1" max="10000" step="0.01" placeholder="宽" aria-label="画面比例的宽"><span aria-hidden="true">:</span><input id="ratioWidthInput" class="ratioInput" type="number" min="1" max="10000" step="0.01" placeholder="高" aria-label="画面比例的高"></div></div></div></div><div class="playModeBar" id="playModeBar"><label id="autoplayLabel"><input id="autoplayToggle" type="checkbox"> 自动游玩</label><label class="playTuneLabel">音符大小 <input id="playNoteScaleInput" class="playTuneInput" type="number" min="0.25" max="4" step="0.05" value="1"></label><label class="playTuneLabel">流速 <input id="playFlowSpeedInput" class="playTuneInput" type="number" min="0.1" step="0.1" value="7.0"></label><button id="exportVideoBtn" class="primary" title="导出当前谱面播放窗口为视频">导出视频</button><span id="exportVideoProgress" class="hint" hidden></span></div><video id="audioPlayer" preload="auto" playsinline style="display:none"></video></section>
 </div>
<label class="lowMemoryStandalone"><input id="lowMemoryToggle" type="checkbox"> 低内存模式（降低画布与贴图缓存占用）</label>
<script src="js/00-ios12-runtime.js"></script>
<script src="js/fflate.js"></script>
<script src="js/builtin-sources.js"></script>
<script src="js/01-base.js"></script>
<script src="js/02-requested-textures.js"></script>
<script src="js/03-plu-render.js"></script>
<script src="js/04-plu-effects.js"></script>
<script src="js/05-plu-hitring.js"></script>
<script src="js/06-mode-build.js"></script>
<script src="js/07-hud-progress.js"></script>
<script src="js/07-play-controls.js"></script>
<script src="js/08-hud-pause.js"></script>
<script src="js/08-play-enlarged.js"></script>
<script src="js/08-pause-menu.js"></script>
<script src="js/08-delay-calibration.js"></script>
<script src="js/09-package.js"></script>
<script src="js/09-score.js"></script>
<script src="js/10-gameplay.js"></script>
<script src="js/11-rain-textures.js"></script>
<script src="js/12-storyboard-final.js"></script>
<script src="js/13-fullscreen.js"></script>
<script src="js/14-mobile-continuity.js"></script>
<script src="js/15-algebra-storyboard.js"></script>
<script src="js/16-targeted-perf.js"></script>
<script src="js/result-grade.js"></script>
<script src="js/17-result-page.js"></script>
<script src="js/18-result-keys.js"></script>
<script src="js/19-result-stage.js"></script>
<script src="js/20-video-export.js"></script>
<script src="js/21-stage-environment.js"></script>
<script src="js/22-stage-ratio.js"></script>
<script src="js/23-low-memory.js"></script>
<script src="js/24-player-settings.js"></script>
</body>
</html>
